name: Build LiquidBounce

on:
  push:
    branches:
      - Liquidbounce-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build mod
        run: .\gradlew.bat build -x detekt -x test -x generateGitProperties --console=plain

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LBnew-build
          path: build/libs/*.jar
          if-no-files-found: error
