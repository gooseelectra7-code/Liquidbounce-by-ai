kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# Gradle settings - optimized for JAR-based invocation
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false

# ZGC from JDK 25 (upgraded from JDK 21)
org.gradle.jvmargs=-Xms1024m -Xmx6144m -XX:+UseZGC --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.base/sun.nio.fs=ALL-UNNAMED --add-opens java.base/sun.security.ssl=ALL-UNNAMED --add-opens java.base/sun.security.util=ALL-UNNAMED --add-opens java.base/sun.net.sponsor=ALL-UNNAMED --add-opens java.base/sun.net.protocol.http=ALL-UNNAMED

org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Mod Properties
mod_version=0.38.1
mod_mc_version=26.2
maven_group=net.ccbluex
archives_base_name=LBnew

# Disable configuration cache (may cause issues with JAR-based execution)
#org.gradle.configuration-cache=true

# Enable logging
org.gradle.logging.level=lifecycle
